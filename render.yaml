services:
  - type: web
    name: ecosort-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        sync: false # You will need to add your Vercel domain here in the Render dashboard
